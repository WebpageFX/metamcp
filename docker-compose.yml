services:
  app:
    container_name: metamcp
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/fanywebfx/metamcp:ai-dev
    # Use a local image when present; pull from GHCR only if missing.
    # Override with: docker compose pull && docker compose up -d
    pull_policy: missing
    env_file:
      - path: .env
        required: false
    ports:
      - "12008:12008"
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/data/metamcp.db}
      
      # Application URL configuration
      APP_URL: ${APP_URL:-http://localhost:12008}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:12008}
      
      # Auth configuration
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-your-super-secret-key-change-this-in-production}
      
      # Docker networking fix
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: ${TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL:-true}
      
      # ========================================================================
      # Bootstrap Configuration Examples
      # ========================================================================
      
      # Multiple Users - Define different users with different roles
      # BOOTSTRAP_USERS: |
      #   [
      #     {
      #       "email": "admin@company.com",
      #       "password": "admin-secure-password",
      #       "name": "System Administrator"
      #     },
      #     {
      #       "email": "developer@company.com",
      #       "password": "dev-secure-password",
      #       "name": "Lead Developer"
      #     },
      #     {
      #       "email": "analyst@company.com",
      #       "password": "analyst-secure-password",
      #       "name": "Data Analyst"
      #     }
      #   ]
      
      # API Keys - Assign keys to specific users using user_email
      # BOOTSTRAP_API_KEYS: |
      #   [
      #     {
      #       "name": "Admin Production Key",
      #       "is_public": false,
      #       "user_email": "admin@company.com"
      #     },
      #     {
      #       "name": "Developer Key",
      #       "is_public": false,
      #       "user_email": "developer@company.com"
      #     },
      #     {
      #       "name": "Analyst Key",
      #       "is_public": false,
      #       "user_email": "analyst@company.com"
      #     },
      #     {
      #       "name": "Public API Key",
      #       "is_public": true
      #     }
      #   ]
      
      # Namespaces - Create user-specific workspaces
      # BOOTSTRAP_NAMESPACES: |
      #   [
      #     {
      #       "name": "Admin Workspace",
      #       "description": "Administrator's private workspace",
      #       "is_public": false,
      #       "user_email": "admin@company.com",
      #       "update": true
      #     },
      #     {
      #       "name": "Development",
      #       "description": "Development environment",
      #       "is_public": false,
      #       "user_email": "developer@company.com",
      #       "update": true
      #     },
      #     {
      #       "name": "Analytics",
      #       "description": "Data analytics workspace",
      #       "is_public": false,
      #       "user_email": "analyst@company.com",
      #       "update": true
      #     },
      #     {
      #       "name": "Shared Resources",
      #       "description": "Public shared namespace",
      #       "is_public": true,
      #       "update": true
      #     }
      #   ]
      
      # Endpoints - Configure endpoints with different owners and auth settings
      # Note: Endpoints can optionally specify which namespace they should be created in
      # BOOTSTRAP_ENDPOINTS: |
      #   [
      #     {
      #       "name": "admin-api",
      #       "description": "Admin-only API endpoint",
      #       "namespace": "Production",
      #       "enable_auth": true,
      #       "enable_auth_query": false,
      #       "enable_auth_oauth": true,
      #       "is_public": false,
      #       "user_email": "admin@company.com",
      #       "update": true
      #     },
      #     {
      #       "name": "dev-api",
      #       "description": "Development API endpoint",
      #       "namespace": "Development",
      #       "enable_auth": true,
      #       "enable_auth_query": true,
      #       "enable_auth_oauth": false,
      #       "is_public": false,
      #       "user_email": "developer@company.com",
      #       "update": true
      #     },
      #     {
      #       "name": "analytics-api",
      #       "description": "Analytics API endpoint",
      #       "namespace": "Analytics",
      #       "enable_auth": true,
      #       "enable_auth_query": false,
      #       "enable_auth_oauth": false,
      #       "is_public": false,
      #       "user_email": "analyst@company.com",
      #       "update": true
      #     },
      #     {
      #       "name": "public-api",
      #       "description": "Public API endpoint - no auth required",
      #       "namespace": "Shared Resources",
      #       "enable_auth": false,
      #       "enable_auth_query": false,
      #       "enable_auth_oauth": false,
      #       "is_public": true,
      #       "update": true
      #     }
      #   ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    volumes:
      # External volume survives image rebuilds / MetaMCP upgrades.
      # Create once: docker volume create global_metamcp_sqlite_data
      - global_metamcp_sqlite_data:/data
      # Persist the uv cache across container recreates. Without this, every
      # `docker compose up -d`/recreate wipes the writable layer and the next
      # `uvx <pkg>@latest` spawn for each STDIO server cold-installs from
      # scratch — slow enough to trip the crash detector and stick the server
      # in error_status=ERROR. The image ships /home/nextjs/.cache/uv owned by
      # nextjs (uid 1001) so a fresh named volume inherits correct ownership.
      - uv_cache:/home/nextjs/.cache/uv
    networks:
      - metamcp-network

volumes:
  global_metamcp_sqlite_data:
    external: true
    name: global_metamcp_sqlite_data
  uv_cache:
    driver: local

networks:
  metamcp-network:
    driver: bridge
